<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>핵심인재 토크콘서트 — 진행 큐카드</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<style>
@font-face {
  font-family: 'Pretendard';
  src: url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/woff2/Pretendard-Regular.woff2') format('woff2');
  font-weight: 400;
}
@font-face {
  font-family: 'Pretendard';
  src: url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/woff2/Pretendard-SemiBold.woff2') format('woff2');
  font-weight: 600;
}
@font-face {
  font-family: 'Pretendard';
  src: url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/woff2/Pretendard-Black.woff2') format('woff2');
  font-weight: 900;
}

:root{
  --bg: #14171c;
  --bg-raised: #1b1f26;
  --ink: #f5f1e8;
  --ink-dim: #9aa0ab;
  --ink-faint: #5c6270;
  --amber: #e8a33d;
  --amber-dim: #6b5330;
  --line: #2a2e37;
  --danger: #c96a52;
}

*{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
html,body{ height:100%; }
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:'Pretendard', -apple-system, sans-serif;
  overflow:hidden;
  user-select:none;
}

/* ---- top meta bar ---- */
.meta{
  position:fixed; top:0; left:0; right:0;
  padding: max(14px, env(safe-area-inset-top)) 24px 10px;
  display:flex; justify-content:space-between; align-items:baseline;
  z-index:20;
  background:linear-gradient(var(--bg) 60%, transparent);
}
.meta .evt{ font-size:13px; letter-spacing:.08em; color:var(--ink-faint); text-transform:uppercase; font-weight:600; }
.meta .clock{ font-family:'SF Mono','JetBrains Mono',monospace; font-size:15px; color:var(--ink-dim); font-variant-numeric: tabular-nums; }

/* ---- timeline ---- */
.timeline{
  position:fixed; top:44px; left:0; right:0; height:4px;
  display:flex; gap:3px; padding:0 20px; z-index:20;
}
.timeline .seg{
  flex:1; height:100%; border-radius:3px;
  background:var(--line);
  transition:background .3s;
}
.timeline .seg.done{ background:var(--amber-dim); }
.timeline .seg.active{ background:var(--amber); }

/* ---- main stage ---- */
.stage{
  position:absolute; inset:0;
  display:flex; align-items:center; justify-content:center;
}
.card{
  position:absolute; inset:0;
  display:flex; flex-direction:column; justify-content:center;
  padding: 90px 48px 120px;
  opacity:0; pointer-events:none;
  transform: translateY(12px);
  transition: opacity .35s ease, transform .35s ease;
}
.card.active{ opacity:1; pointer-events:auto; transform:translateY(0); }

.spotlight{
  position:absolute; top:50%; left:50%;
  width:900px; height:900px;
  transform:translate(-50%,-50%);
  background: radial-gradient(circle, var(--amber-dim) 0%, transparent 62%);
  opacity:.35;
  pointer-events:none;
  animation: breathe 6s ease-in-out infinite;
  z-index:0;
}
@keyframes breathe{ 0%,100%{ opacity:.28; } 50%{ opacity:.42; } }

.card > *{ position:relative; z-index:1; }

.tag{
  display:inline-flex; align-items:center; gap:10px;
  font-size:14px; font-weight:600; letter-spacing:.06em;
  color:var(--amber); text-transform:uppercase;
  margin-bottom:18px;
}
.tag .num{
  font-family:'SF Mono','JetBrains Mono',monospace;
  background:var(--amber); color:var(--bg);
  padding:3px 9px; border-radius:6px; font-size:13px;
}
.tag .dur{ color:var(--ink-faint); font-weight:400; }

h1.title{
  font-size:26px; font-weight:900; margin:0 0 28px; color:var(--ink);
  letter-spacing:-.01em;
}

.quote{
  font-size:clamp(26px, 3.4vw, 40px);
  font-weight:600;
  line-height:1.5;
  color:var(--ink);
  max-width:920px;
  margin-bottom:34px;
}
.quote::before{ content:"“"; color:var(--amber); }
.quote::after{ content:"”"; color:var(--amber); }

.notes{
  display:flex; flex-direction:column; gap:14px;
  max-width:820px;
}
.notes .group-label{
  font-size:12px; font-weight:600; letter-spacing:.08em;
  color:var(--ink-faint); text-transform:uppercase; margin-bottom:2px;
}
.notes ul{ margin:0; padding-left:0; list-style:none; }
.notes li{
  font-size:17px; color:var(--ink-dim); line-height:1.6;
  padding-left:18px; position:relative; margin-bottom:6px;
}
.notes li::before{ content:"—"; position:absolute; left:0; color:var(--ink-faint); }
.bridge{
  margin-top:22px; padding-top:18px; border-top:1px solid var(--line);
  font-size:16px; color:var(--ink-faint); font-style:normal; max-width:820px;
}
.bridge b{ color:var(--ink-dim); font-weight:600; }

/* ---- opening / closing special ---- */
.plain-lines p{ font-size:19px; color:var(--ink-dim); line-height:1.7; max-width:800px; margin:0 0 14px; }

/* ---- bottom nav ---- */
.nav{
  position:fixed; bottom:0; left:0; right:0;
  padding:16px 24px max(16px, env(safe-area-inset-bottom));
  display:flex; align-items:center; justify-content:space-between;
  background:linear-gradient(transparent, var(--bg) 55%);
  z-index:20;
}
.dots{ display:flex; gap:8px; }
.dot{
  width:8px; height:8px; border-radius:50%;
  background:var(--line);
  transition:all .25s;
}
.dot.active{ background:var(--amber); width:22px; border-radius:4px; }
.btn{
  width:52px; height:52px; border-radius:50%;
  border:1px solid var(--line); background:var(--bg-raised);
  color:var(--ink); font-size:22px;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer;
}
.btn:active{ background:var(--amber-dim); }
.btn.disabled{ opacity:.25; pointer-events:none; }
.nav-btns{ display:flex; gap:12px; }

/* ---- backup overlay ---- */
.backup-toggle{
  position:fixed; top:max(14px, env(safe-area-inset-top)); right:24px;
  z-index:30;
  background:var(--bg-raised); border:1px solid var(--line);
  color:var(--ink-dim); font-size:13px; font-weight:600;
  padding:8px 14px; border-radius:20px; cursor:pointer;
  letter-spacing:.02em;
}
.overlay{
  position:fixed; inset:0; background:rgba(10,12,15,.92);
  backdrop-filter: blur(6px);
  z-index:40; display:none;
  padding: max(60px, env(safe-area-inset-top) + 40px) 40px 40px;
  overflow-y:auto;
}
.overlay.open{ display:block; }
.overlay-close{
  position:fixed; top:max(14px, env(safe-area-inset-top)); right:24px;
  z-index:41; background:var(--amber); color:var(--bg);
  border:none; width:40px; height:40px; border-radius:50%;
  font-size:18px; font-weight:700; cursor:pointer;
}
.overlay h2{ font-size:22px; color:var(--amber); margin:0 0 6px; }
.overlay .sub{ color:var(--ink-faint); font-size:14px; margin-bottom:28px; }
.backup-item{
  border-top:1px solid var(--line); padding:20px 0;
}
.backup-item:last-child{ border-bottom:1px solid var(--line); }
.backup-item .bnum{
  font-family:'SF Mono','JetBrains Mono',monospace; color:var(--amber); font-size:13px; margin-right:8px;
}
.backup-item .btext{ font-size:19px; font-weight:600; color:var(--ink); line-height:1.5; }
.backup-item .bpos{ font-size:14px; color:var(--ink-faint); margin-top:8px; line-height:1.5; }

/* ---- touch zones for tap navigation ---- */
.tapzone{ position:absolute; top:0; bottom:0; width:30%; z-index:10; }
.tapzone.left{ left:0; }
.tapzone.right{ right:0; }
</style>
</head>
<body>

<div class="meta">
  <div class="evt">핵심인재 토크콘서트</div>
  <div class="clock" id="clock">60:00</div>
</div>
<div class="timeline" id="timeline"></div>

<button class="backup-toggle" id="backupBtn">예비 질문</button>

<div class="stage" id="stage"></div>

<div class="tapzone left" id="tapLeft"></div>
<div class="tapzone right" id="tapRight"></div>

<div class="nav">
  <div class="nav-btns">
    <div class="btn" id="prevBtn">‹</div>
  </div>
  <div class="dots" id="dots"></div>
  <div class="nav-btns">
    <div class="btn" id="nextBtn">›</div>
  </div>
</div>

<div class="overlay" id="overlay">
  <button class="overlay-close" id="overlayClose">✕</button>
  <h2>예비 질문 후보</h2>
  <div class="sub">시간이 남거나 흐름이 빌 때 투입</div>
  <div id="backupList"></div>
</div>

<script>
const sections = [
  {
    type:'plain', tag:'OPENING', num:'0', dur:'3분',
    title:'오프닝',
    lines:[
      '“김성준 교수님 특강 잘 들으셨나요? ‘일하는 방식’에 대해 좋은 인사이트 많이 얻으셨을 것 같은데요.”',
      '“오늘은 이론이 아니라, 그 ‘일하는 방식’을 몸으로 겪어내고 지금 이 자리까지 오신 선배님들의 진짜 이야기를 들어보려고 합니다.”',
      '“한때 핵심인재였고 지금은 리더의 자리에서 여러분을 이끌고 계신 네 분을 모셨습니다. 시작하겠습니다.”'
    ],
    bridgeLabel:'착석 후 안내', bridge:'“오늘은 정해진 순서 없이, 마이크 두 개를 자유롭게 주고받으면서 편하게 이야기 나눠주시면 됩니다. 저는 질문만 드릴게요.”'
  },
  {
    type:'q', tag:'Q1 · 의견조율', num:'1', dur:'8분',
    quote:'회사 생활을 하다 보면 나와 업무 성향이나 가치관이 다른 사람을 꼭 만나게 되잖아요. 그런 상황에서 지혜롭게 상대방을 설득하고 업무를 풀어가는, 각자만의 노하우가 있으실까요?',
    follow:[
      '그럼 반대로, 설득이 안 통했던 경험도 있으실까요?',
      '그때랑 지금 리더가 되고 나서 설득하는 방식이 달라지셨나요?'
    ],
    bridgeLabel:'다음으로', bridge:'의견 차이도 결국 사람 사이의 문제인데, 그러다 보면 정말 힘든 순간도 찾아오잖아요.'
  },
  {
    type:'q', tag:'Q2 · 슬럼프 + 실패 극복 · 하이라이트', num:'2', dur:'14분',
    quote:'회사 생활을 하다 보면 에너지가 완전히 바닥나거나, 되돌리기 힘든 실패를 겪는 순간이 오잖아요. 가장 힘들었던 순간은 언제였고, 그걸 어떻게 극복하셨나요?',
    follow:[
      '그 시기, 혼자 버티신 건가요 아니면 누군가의 도움이 있었나요?',
      '그때는 회복이 안 될 것 같았을 텐데, 지금 돌아보면 어떤 의미로 남아있나요?',
      '혹시 그 실패를 지금 팀원이 반복하려고 할 때, 어떻게 도와주시나요?'
    ],
    bridgeLabel:'다음으로', bridge:'그런 시간들을 지나오면서, 숫자만 보던 시야에서 현장까지 함께 보는 감각이 생기셨을 것 같아요.'
  },
  {
    type:'q', tag:'Q3 · 사업을 보는 눈', num:'3', dur:'12분',
    quote:'숫자와 현장 감각을 함께 갖춘, 이른바 ‘사업을 보는 눈’은 어떤 경험을 통해 만들어지셨나요?',
    follow:[
      '그 눈이 생겼다는 걸 스스로 처음 느낀 순간이 있으셨어요?',
      '실무자 때는 안 보이다가 지금 리더가 되고 나서야 보이는 것도 있을까요?'
    ],
    bridgeLabel:'다음으로', bridge:'경험이 쌓이면서 보는 눈이 달라진다는 이야기를 해주셨는데, 조금 다른 질문 하나 드려볼게요.'
  },
  {
    type:'q', tag:'Q4 · 전문가 vs 제너럴리스트 · 톤 전환', num:'4', dur:'10분',
    quote:'한 분야의 깊이 있는 전문가가 될 것인가, 아니면 여러 업무를 두루 경험한 균형감 있는 리더가 될 것인가 — 누구나 한 번쯤 하는 고민이잖아요. 어떤 커리어가 더 좋다고 생각하시나요?',
    follow:[
      '두 분 의견이 갈리시는데, 그럼 서로 설득해보실래요? (재미 요소)',
      '본인은 어느 쪽이었고, 지금 후배에게는 어느 쪽을 권하고 싶으세요?'
    ],
    bridgeLabel:'다음으로', bridge:'의견이 갈리는 것 자체가 재밌는 지점인 것 같아요. 마지막 질문 드려볼게요.'
  },
  {
    type:'q', tag:'Q5 · 다음 세대에게 · 마무리', num:'5', dur:'10분',
    quote:'과거엔 평가받는 핵심인재셨지만, 지금은 새로운 핵심인재를 키워내는 자리에 계시잖아요. 다음 세대 리더에게 이것만큼은 꼭 가르쳐주고 싶다, 하는 게 있다면요?',
    follow:['팔로우업 없이 각 패널의 답을 충분히 들어주는 것으로 마무리'],
    bridgeLabel:'', bridge:''
  },
  {
    type:'plain', tag:'CLOSING', num:'6', dur:'3분',
    title:'클로징 — 청중 즉석 질문',
    lines:[
      '“이제 이 이야기를 듣기만 하신 여러분 차례입니다. 평소에 리더분들께 궁금했던 것, 지금 이 자리 아니면 못 물어볼 것 같은 질문, 편하게 던져주세요.”',
      '백업 질문(질문이 안 나올 경우): “이 자리에 계신 후배 핵심인재분들께 응원 한마디씩 부탁드려도 될까요?”',
      '마무리 멘트: “오늘 네 분의 이야기를 들으면서, 결국 ‘일하는 방식’이라는 게 이론이 아니라 매 순간의 선택과 실패, 그리고 그걸 견뎌낸 시간이 쌓여서 만들어지는 거라는 생각이 들었습니다. 바쁘신 시간 내주신 패널분들께 다시 한번 큰 박수 부탁드립니다. 감사합니다.”'
    ],
    bridgeLabel:'', bridge:''
  },
];

const backups = [
  { text:'자신만의 업무 완결성을 높이는 노하우', pos:'Q1(의견조율) 근처 — ‘일하는 방식’ 결이 맞음' },
  { text:'리더가 되기 위한 보이지 않는 자질', pos:'Q5(다음 세대에게) 앞 — 자연스러운 예열' },
  { text:'지금 경영진으로서 가장 치열하게 고민하고 있는 회사의 이슈', pos:'무거울 수 있어, 시간 촉박하면 생략 1순위' },
  { text:'지금까지 성장하는 데 도움이 됐던 활동/교육 프로그램', pos:'Q3(사업을 보는 눈)과 결이 비슷 — 대체 질문으로도 활용' },
  { text:'실무자일 때 팀/실/본부장이 될 거라고 생각했는지, 실제로 됐을 때 기대와 가장 달랐던 점', pos:'Q4(전문가 vs 제너럴리스트) 다음 — ‘리더가 된다는 것’ 이야기로 연결' },
];

const stage = document.getElementById('stage');
const dotsEl = document.getElementById('dots');
const timelineEl = document.getElementById('timeline');

sections.forEach((s, i) => {
  const card = document.createElement('div');
  card.className = 'card';
  card.dataset.i = i;

  const spot = document.createElement('div');
  spot.className = 'spotlight';
  card.appendChild(spot);

  const tag = document.createElement('div');
  tag.className = 'tag';
  tag.innerHTML = `<span class="num">${s.num}</span> ${s.tag} <span class="dur">· ${s.dur}</span>`;
  card.appendChild(tag);

  if (s.type === 'plain') {
    const h = document.createElement('h1');
    h.className = 'title';
    h.textContent = s.title;
    card.appendChild(h);
    const wrap = document.createElement('div');
    wrap.className = 'plain-lines';
    s.lines.forEach(l => {
      const p = document.createElement('p');
      p.textContent = l;
      wrap.appendChild(p);
    });
    card.appendChild(wrap);
  } else {
    const q = document.createElement('div');
    q.className = 'quote';
    q.textContent = s.quote;
    card.appendChild(q);

    const notes = document.createElement('div');
    notes.className = 'notes';
    const gl = document.createElement('div');
    gl.className = 'group-label';
    gl.textContent = '팔로우업 후보';
    notes.appendChild(gl);
    const ul = document.createElement('ul');
    s.follow.forEach(f => {
      const li = document.createElement('li');
      li.textContent = f;
      ul.appendChild(li);
    });
    notes.appendChild(ul);
    card.appendChild(notes);
  }

  if (s.bridge) {
    const b = document.createElement('div');
    b.className = 'bridge';
    b.innerHTML = `<b>${s.bridgeLabel}</b> — ${s.bridge}`;
    card.appendChild(b);
  }

  stage.appendChild(card);

  const dot = document.createElement('div');
  dot.className = 'dot';
  dotsEl.appendChild(dot);

  const seg = document.createElement('div');
  seg.className = 'seg';
  timelineEl.appendChild(seg);
});

let current = 0;
const cards = document.querySelectorAll('.card');
const dots = document.querySelectorAll('.dot');
const segs = document.querySelectorAll('.seg');

function render() {
  cards.forEach((c, i) => c.classList.toggle('active', i === current));
  dots.forEach((d, i) => d.classList.toggle('active', i === current));
  segs.forEach((s, i) => {
    s.classList.toggle('done', i < current);
    s.classList.toggle('active', i === current);
  });
  document.getElementById('prevBtn').classList.toggle('disabled', current === 0);
  document.getElementById('nextBtn').classList.toggle('disabled', current === sections.length - 1);
}
function go(delta) {
  current = Math.max(0, Math.min(sections.length - 1, current + delta));
  render();
}
document.getElementById('prevBtn').onclick = () => go(-1);
document.getElementById('nextBtn').onclick = () => go(1);
document.getElementById('tapLeft').onclick = () => go(-1);
document.getElementById('tapRight').onclick = () => go(1);
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') go(1);
  if (e.key === 'ArrowLeft') go(-1);
});
render();

// swipe
let touchX = null;
document.addEventListener('touchstart', e => touchX = e.touches[0].clientX);
document.addEventListener('touchend', e => {
  if (touchX === null) return;
  const dx = e.changedTouches[0].clientX - touchX;
  if (Math.abs(dx) > 60) go(dx < 0 ? 1 : -1);
  touchX = null;
});

// backup overlay
const overlay = document.getElementById('overlay');
const backupList = document.getElementById('backupList');
backups.forEach((b, i) => {
  const item = document.createElement('div');
  item.className = 'backup-item';
  item.innerHTML = `<div class="btext"><span class="bnum">0${i+1}</span>${b.text}</div><div class="bpos">${b.pos}</div>`;
  backupList.appendChild(item);
});
document.getElementById('backupBtn').onclick = () => overlay.classList.add('open');
document.getElementById('overlayClose').onclick = () => overlay.classList.remove('open');

// countdown clock (60 min total)
let remaining = 60 * 60;
const clockEl = document.getElementById('clock');
function tick() {
  if (remaining > 0) remaining--;
  const m = String(Math.floor(remaining / 60)).padStart(2, '0');
  const s = String(remaining % 60).padStart(2, '0');
  clockEl.textContent = `${m}:${s}`;
}
setInterval(tick, 1000);
</script>
