<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>회식 자리 뽑기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gothic+A1:wght@400;500;700;900&display=swap" rel="stylesheet">

<!-- Firebase (실시간으로 모두에게 같은 결과를 보여주기 위한 공유 저장소) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<style>
  :root{
    --bg:#EFF5FC;
    --bg-deep:#E1EDFA;
    --surface:#FFFFFF;
    --surface2:#EAF3FC;
    --ink:#123061;
    --ink-dim:#5B7290;
    --blue:#1565C0;
    --blue-dark:#0D47A1;
    --red:#D62828;
    --red-dark:#A81E1E;
    --line: rgba(18,48,97,0.14);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 10% 4%, rgba(214,40,40,0.06), transparent 40%),
      radial-gradient(circle at 92% 90%, rgba(21,101,192,0.10), transparent 45%),
      linear-gradient(180deg, var(--bg-deep), var(--bg) 60%);
    color:var(--ink);
    font-family:'Gothic A1', sans-serif;
    min-height:100vh;
    padding:32px 16px 80px;
    overflow-x:hidden;
  }
  .wrap{max-width:980px;margin:0 auto;}

  header{text-align:center;margin-bottom:34px;}
  .eyebrow{
    font-size:13px; letter-spacing:0.35em; color:var(--red);
    text-transform:uppercase; margin-bottom:10px; font-weight:700;
  }
  h1{
    font-family:'Jua', sans-serif;
    font-size:clamp(30px,6vw,50px);
    margin:0 0 10px;
    color:var(--blue-dark);
  }
  .sub{color:var(--ink-dim); font-size:15px; line-height:1.6; margin:0 auto; max-width:540px;}
  .sub b{color:var(--ink);}

  .draw-panel{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:24px;
    padding:32px 24px 28px;
    margin-bottom:40px;
    position:relative;
    box-shadow:0 16px 40px rgba(21,101,192,0.12);
  }
  .name-row{display:flex; gap:10px; justify-content:center; margin-bottom:26px; flex-wrap:wrap;}
  #nameInput{
    background:var(--bg-deep);
    border:1px solid var(--line);
    color:var(--ink);
    padding:14px 18px;
    border-radius:14px;
    font-family:'Gothic A1', sans-serif;
    font-size:16px;
    width:240px;
    outline:none;
    transition:border-color .2s;
  }
  #nameInput:focus{border-color:var(--blue);}
  #nameInput::placeholder{color:#8DA3C2;}
  #nameInput:disabled{opacity:0.4;}

  .stage{display:flex; flex-direction:column; align-items:center; gap:18px;}

  /* 구명튜브(라이프 링) 모양 뽑기 버튼 */
  .cap-btn{
    --size:150px;
    width:var(--size); height:var(--size);
    border:none; padding:0; background:transparent; cursor:pointer;
    position:relative;
    box-shadow:0 12px 26px rgba(21,101,192,0.28);
    border-radius:50%;
    transition:transform .12s ease;
  }
  .cap-btn .ring{
    position:absolute; inset:0; border-radius:50%;
    background: repeating-conic-gradient(var(--red) 0deg 22.5deg, #fff 22.5deg 45deg);
    border:5px solid var(--blue);
  }
  .cap-btn .cap-inner{
    position:absolute; inset:21%; border-radius:50%;
    background:#fff;
    display:flex; align-items:center; justify-content:center; flex-direction:column;
    box-shadow: inset 0 0 0 3px var(--blue);
  }
  .cap-btn .cap-inner .emoji{font-size:18px; line-height:1; margin-bottom:2px;}
  .cap-btn .cap-inner .label{
    font-family:'Jua', sans-serif; font-size:16px; letter-spacing:2px; color:var(--blue-dark);
  }
  .cap-btn:active{transform:scale(0.94);}
  .cap-btn:disabled{filter:grayscale(0.5); opacity:0.55; cursor:not-allowed;}
  .cap-btn.spin{ animation: capSpin .9s cubic-bezier(.2,.9,.3,1); }
  @keyframes capSpin{
    0%{transform:rotate(0deg) scale(1);}
    60%{transform:rotate(900deg) scale(1.08);}
    100%{transform:rotate(1080deg) scale(1);}
  }

  .reel-wrap{height:64px; display:flex; align-items:center; justify-content:center;}
  .reel{font-family:'Jua', sans-serif; font-size:44px; color:var(--red); min-width:70px; text-align:center;}
  .reel.pop{animation: reelPop .5s ease;}
  @keyframes reelPop{
    0%{transform:scale(0.4) rotate(-8deg); opacity:0;}
    60%{transform:scale(1.15) rotate(3deg); opacity:1;}
    100%{transform:scale(1) rotate(0);}
  }

  .result-text{min-height:24px; font-size:16px; color:var(--ink); text-align:center; font-weight:700;}
  .hint{color:var(--ink-dim); font-size:13px;}
  .status{color:var(--red); font-size:13px; min-height:16px;}

  .pool{
    display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:22px;
    padding-top:20px; border-top:1px dashed var(--line);
    max-width:640px; margin-left:auto; margin-right:auto;
  }
  .chip{
    width:34px; height:34px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-family:'Jua', sans-serif; font-size:14px;
    background:var(--surface2); color:var(--blue-dark);
    border:1px solid var(--line);
    transition:all .35s ease;
  }
  .chip.used{
    background:transparent; color:transparent; border-color:transparent;
    transform:scale(0.4); opacity:0;
  }

  .tables{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(230px,1fr));
    gap:22px;
    margin-bottom:36px;
  }
  .table-card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:20px;
    padding:20px 14px 26px;
    text-align:center;
    box-shadow:0 10px 24px rgba(21,101,192,0.08);
  }
  .table-name{font-family:'Jua', sans-serif; font-size:17px; color:var(--blue-dark); margin-bottom:14px; letter-spacing:1px;}
  .table-name span{color:var(--red); font-size:13px; font-weight:400; font-family:'Gothic A1',sans-serif; margin-left:6px;}
  .table-circle{position:relative; width:210px; height:210px; margin:0 auto;}
  .grill{
    position:absolute; inset:26%;
    border-radius:50%;
    background: repeating-conic-gradient(from 0deg, var(--blue) 0deg 8deg, #fff 8deg 16deg);
    border:3px solid var(--red);
    box-shadow:0 2px 10px rgba(21,101,192,0.15);
  }
  .seat{
    position:absolute;
    width:52px; height:52px;
    border-radius:50%;
    background:#fff;
    border:2px solid var(--blue);
    display:flex; align-items:center; justify-content:center;
    flex-direction:column;
    font-size:11px;
    color:var(--ink-dim);
    transform:translate(-50%,-50%);
    transition:all .3s ease;
  }
  .seat .num{font-family:'Jua', sans-serif; font-size:13px; color:var(--blue-dark); line-height:1;}
  .seat .who{font-size:11px; color:var(--ink); font-weight:700; line-height:1.1; margin-top:1px; max-width:46px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .seat.filled{background:var(--red); border-color:var(--red-dark);}
  .seat.filled .num{color:#fff;}
  .seat.filled .who{color:#fff;}
  .seat.pop{animation: seatPop .5s ease;}
  @keyframes seatPop{
    0%{transform:translate(-50%,-50%) scale(0.3);}
    60%{transform:translate(-50%,-50%) scale(1.25);}
    100%{transform:translate(-50%,-50%) scale(1);}
  }

  .log-card{background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:22px 20px; box-shadow:0 10px 24px rgba(21,101,192,0.08);}
  .log-title{font-family:'Jua',sans-serif; font-size:16px; margin-bottom:12px; color:var(--blue-dark);}
  .log-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px;}
  .log-list li{
    display:flex; justify-content:space-between; align-items:center;
    background:var(--bg-deep); border:1px dashed var(--line);
    border-radius:10px; padding:9px 14px; font-size:14px;
  }
  .log-list li b{color:var(--red); font-family:'Jua',sans-serif;}
  .log-empty{color:var(--ink-dim); font-size:14px; text-align:center; padding:8px 0;}

  .done-banner{display:none; text-align:center; margin-top:18px;}
  .done-banner.show{display:block; animation:reelPop .5s ease;}
  .done-banner .msg{font-family:'Jua',sans-serif; font-size:20px; color:var(--red); margin-bottom:12px;}
  .reset-btn{
    background:transparent; border:1px solid var(--blue); color:var(--blue-dark);
    padding:10px 22px; border-radius:999px; font-family:'Gothic A1',sans-serif;
    font-weight:700; cursor:pointer; font-size:14px;
  }
  .reset-btn:hover{background:var(--blue); color:#fff;}

  footer{text-align:center; color:var(--ink-dim); font-size:12px; margin-top:30px;}

  @media (prefers-reduced-motion: reduce){
    .cap-btn.spin, .reel.pop, .seat.pop, .done-banner.show{animation:none;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="eyebrow">2026 회식 · SEAT DRAW</div>
    <h1>오늘 자리에 닻을 내려요</h1>
    <p class="sub">이름을 적고 <b>구명튜브를 눌러</b> 번호를 뽑으세요. 다른 사람이 이미 뽑은 결과도 실시간으로 함께 보여요.<br>1~14번, 테이블 3개 (6·4·4명) 랜덤 배치.</p>
  </header>

  <div class="draw-panel">
    <div class="name-row">
      <input id="nameInput" type="text" placeholder="이름을 입력하세요" maxlength="10">
    </div>

    <div class="stage">
      <button class="cap-btn" id="capBtn">
        <span class="ring"></span>
        <span class="cap-inner"><span class="emoji">⚓</span><span class="label">뽑기</span></span>
      </button>
      <div class="reel-wrap"><div class="reel" id="reel">?</div></div>
      <div class="result-text" id="resultText">이름을 입력하고 구명튜브를 눌러보세요</div>
      <div class="hint" id="remainHint">남은 번호 14개</div>
      <div class="status" id="statusText"></div>
    </div>

    <div class="pool" id="pool"></div>

    <div class="done-banner" id="doneBanner">
      <div class="msg">🎉 전원 배치 완료! 맛있는 회식 되세요</div>
      <button class="reset-btn" id="resetBtn">다시 뽑기 (전체 초기화)</button>
    </div>
  </div>

  <div class="tables" id="tables"></div>

  <div class="log-card">
    <div class="log-title">배치 명단</div>
    <ul class="log-list" id="logList"></ul>
  </div>

  <footer>회식 자리 뽑기 · 즐거운 저녁 되세요</footer>
</div>

<script>
/* =========================================================
   Firebase 프로젝트 설정값 (기존과 동일하게 유지)
   ========================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyBaatButaVgDvoFM9MFWuNX6up1i2BMSO0",
  authDomain: "seating-e141a.firebaseapp.com",
  databaseURL: "https://seating-e141a-default-rtdb.firebaseio.com",
  projectId: "seating-e141a",
  storageBucket: "seating-e141a.firebasestorage.app",
  messagingSenderId: "971259762582",
  appId: "1:971259762582:web:02359be00fbdf003b1efb7"
};

/* 이 이벤트를 구분하는 이름입니다. 기존 데이터와 동일하게 유지합니다. */
const ROOM_ID = "hoesik-2026";

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const seatingRef = db.ref('seatings/' + ROOM_ID + '/assignments');

(function(){
  // ⚠️ 테이블 구성: 6명 / 4명 / 4명
  const TABLES = [
    { id:'t1', name:'1번 테이블', range:[1,6]  },
    { id:'t2', name:'2번 테이블', range:[7,10] },
    { id:'t3', name:'3번 테이블', range:[11,14]},
  ];

  const flavor = [
    (n,t)=>`${n}번, 닻을 내린 곳은 ${t}입니다!`,
    (n,t)=>`파도를 타고 온 번호 ${n}번 — ${t}으로 안내합니다.`,
    (n,t)=>`구명튜브를 던졌더니 ${n}번! ${t} 자리예요.`,
    (n,t)=>`오늘의 항구는 ${t} ${n}번 — 짜잔! ⚓`,
  ];

  let currentAssignments = {};   // { "3": {name, ts}, ... } - Firebase에서 실시간으로 받아옴
  let drawing = false;
  let spinTimer = null;

  const capBtn = document.getElementById('capBtn');
  const nameInput = document.getElementById('nameInput');
  const reel = document.getElementById('reel');
  const resultText = document.getElementById('resultText');
  const remainHint = document.getElementById('remainHint');
  const statusText = document.getElementById('statusText');
  const poolEl = document.getElementById('pool');
  const tablesEl = document.getElementById('tables');
  const logList = document.getElementById('logList');
  const doneBanner = document.getElementById('doneBanner');
  const resetBtn = document.getElementById('resetBtn');

  function buildTables(){
    tablesEl.innerHTML = '';
    TABLES.forEach(t=>{
      const [start,end] = t.range;
      const count = end-start+1;
      const card = document.createElement('div');
      card.className = 'table-card';
      card.innerHTML = `<div class="table-name">${t.name}<span>${count}인석</span></div>
        <div class="table-circle" id="circle-${t.id}"><div class="grill"></div></div>`;
      tablesEl.appendChild(card);
      const circle = card.querySelector(`#circle-${t.id}`);
      const R = 82;
      for(let n=start, i=0; n<=end; n++, i++){
        const angle = (i/count)*Math.PI*2 - Math.PI/2;
        const x = 50 + (R/210*100)*Math.cos(angle);
        const y = 50 + (R/210*100)*Math.sin(angle);
        const seat = document.createElement('div');
        seat.className = 'seat';
        seat.id = 'seat-'+n;
        seat.style.left = x+'%';
        seat.style.top = y+'%';
        seat.innerHTML = `<span class="num">${n}</span><span class="who"></span>`;
        circle.appendChild(seat);
      }
    });
  }

  function buildPool(){
    poolEl.innerHTML = '';
    for(let n=1;n<=14;n++){
      const chip = document.createElement('div');
      chip.className = 'chip';
      chip.id = 'chip-'+n;
      chip.textContent = n;
      poolEl.appendChild(chip);
    }
  }

  function tableForNumber(n){
    return TABLES.find(t=>n>=t.range[0] && n<=t.range[1]);
  }

  function availableNumbers(assignments){
    const taken = Object.keys(assignments || {}).map(Number);
    const list = [];
    for(let n=1;n<=14;n++) if(!taken.includes(n)) list.push(n);
    return list;
  }

  seatingRef.on('value', (snapshot)=>{
    currentAssignments = snapshot.val() || {};
    renderFromData();
  }, (err)=>{
    statusText.textContent = 'Firebase 연결에 문제가 있어요. firebaseConfig 값을 확인해주세요.';
  });

  function renderFromData(){
    for(let n=1;n<=14;n++){
      const seat = document.getElementById('seat-'+n);
      const chip = document.getElementById('chip-'+n);
      const entry = currentAssignments[n];
      if(entry){
        if(!seat.classList.contains('filled')){
          seat.classList.add('filled');
        }
        seat.querySelector('.who').textContent = entry.name;
        if(chip) chip.classList.add('used');
      } else {
        seat.classList.remove('filled');
        seat.querySelector('.who').textContent = '';
        if(chip) chip.classList.remove('used');
      }
    }

    const entries = Object.keys(currentAssignments).map(k=>({
      num:Number(k), name:currentAssignments[k].name, ts:currentAssignments[k].ts||0
    })).sort((a,b)=>b.ts-a.ts);

    if(entries.length===0){
      logList.innerHTML = '<div class="log-empty">아직 뽑은 사람이 없습니다</div>';
    } else {
      logList.innerHTML = entries.map(e=>{
        const t = tableForNumber(e.num);
        return `<li><span>${e.name}</span><span><b>${e.num}번</b> · ${t.name}</span></li>`;
      }).join('');
    }

    const remain = availableNumbers(currentAssignments).length;
    remainHint.textContent = remain>0 ? `남은 번호 ${remain}개` : '';

    if(remain===0){
      capBtn.disabled = true;
      nameInput.disabled = true;
      doneBanner.classList.add('show');
    } else {
      doneBanner.classList.remove('show');
    }
  }

  function draw(){
    const name = nameInput.value.trim();
    if(!name){ nameInput.focus(); return; }
    if(drawing) return;
    if(availableNumbers(currentAssignments).length===0) return;

    drawing = true;
    nameInput.disabled = true;
    capBtn.disabled = true;
    statusText.textContent = '';
    resultText.textContent = '두구두구두구...';

    capBtn.classList.remove('spin'); void capBtn.offsetWidth; capBtn.classList.add('spin');

    spinTimer = setInterval(()=>{
      const avail = availableNumbers(currentAssignments);
      if(avail.length===0){ clearInterval(spinTimer); return; }
      reel.textContent = avail[Math.floor(Math.random()*avail.length)];
    }, 60);

    let myPick = null;

    seatingRef.transaction(function(currentData){
      currentData = currentData || {};
      const taken = Object.keys(currentData).map(Number);
      const avail = [];
      for(let n=1;n<=14;n++) if(!taken.includes(n)) avail.push(n);
      if(avail.length===0){
        myPick = null;
        return;
      }
      const pick = avail[Math.floor(Math.random()*avail.length)];
      myPick = pick;
      currentData[pick] = { name: name, ts: Date.now() };
      return currentData;
    }, function(error, committed, snapshot){
      clearInterval(spinTimer);
      drawing = false;

      if(error){
        statusText.textContent = '저장 중 오류가 발생했어요. 다시 시도해주세요.';
        nameInput.disabled = false;
        capBtn.disabled = false;
        resultText.textContent = '이름을 입력하고 구명튜브를 눌러보세요';
        return;
      }
      if(!committed || myPick===null){
        statusText.textContent = '이미 모든 자리가 배정되었어요.';
        resultText.textContent = '';
        return;
      }

      const num = myPick;
      const t = tableForNumber(num);
      reel.textContent = num;
      reel.classList.remove('pop'); void reel.offsetWidth; reel.classList.add('pop');

      const line = flavor[Math.floor(Math.random()*flavor.length)](num, t.name);
      resultText.innerHTML = `<b>${name}</b>님 — ${line}`;

      const seat = document.getElementById('seat-'+num);
      seat.classList.remove('pop'); void seat.offsetWidth; seat.classList.add('pop');

      nameInput.value = '';
      if(availableNumbers(currentAssignments).length>0){
        nameInput.disabled = false;
        capBtn.disabled = false;
        nameInput.focus();
      }
    });
  }

  function resetAll(){
    if(!confirm('정말 전체 배치를 초기화할까요? 지금까지 뽑은 결과가 모두 삭제됩니다.')) return;
    seatingRef.remove();
    reel.textContent = '?';
    resultText.textContent = '이름을 입력하고 구명튜브를 눌러보세요';
    statusText.textContent = '';
    nameInput.disabled = false;
    capBtn.disabled = false;
  }

  capBtn.addEventListener('click', draw);
  nameInput.addEventListener('keydown', e=>{ if(e.key==='Enter') draw(); });
  resetBtn.addEventListener('click', resetAll);

  buildTables();
  buildPool();
})();
</script>
</body>
</html>
